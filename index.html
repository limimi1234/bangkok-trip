function classifySpot(name){const n=name.toLowerCase();let cat="기타",area="미분류";if(/massage|spa|health land|마사지/.test(n))cat="마사지";else if(/beach|pool|water|jomtien|pattaya|수영|비치/.test(n))cat="물놀이";else if(/icon|central|siam|sphere|terminal|mall|shopping|쇼핑/.test(n))cat="쇼핑";else if(/market|fair|yaowarat|banthat|night|시장|야시장/.test(n))cat="시장/먹거리";else if(/bar|rooftop|cruise|thong|ekkamai|바|루프탑/.test(n))cat="바/야경";else if(/cafe|coffee|ari|song wat|talat noi|카페/.test(n))cat="카페/거리";else if(/wat |temple|palace|mahanakhon|asiatique|museum|park|왕궁|사원|전망/.test(n))cat="관광/명소";if(/asok|terminal 21|health land asoke/.test(n))area="아속";else if(/grand palace|wat pho|wat arun/.test(n))area="왕궁·올드타운";else if(/yaowarat|song wat|talat noi/.test(n))area="차이나타운";else if(/siam|centralworld|paragon/.test(n))area="시암·칠롬";else if(/emsphere|phrom phong/.test(n))area="프롬퐁";else if(/ari/.test(n))area="아리";else if(/thong|ekkamai/.test(n))area="통로·에까마이";else if(/chatuchak/.test(n))area="짜뚜짝";else if(/banthat|samyan/.test(n))area="삼얀·반탓통";else if(/icon|asiatique|chao phraya|cruise/.test(n))area="짜오프라야 강변";else if(/mahanakhon|silom|sathon/.test(n))area="실롬·사톤";else if(/jodd|rama 9|ratchada/.test(n))area="라마9·라차다";else if(/pattaya|jomtien/.test(n))area="파타야";return{cat,area}}

function renderSpots(){const cv=$("catFilter").value||"전체",av=$("areaFilter").value||"전체";const cats=["전체",...new Set(s.spots.map(x=>x.cat))],areas=["전체",...new Set(s.spots.map(x=>x.area))];$("catFilter").innerHTML=cats.map(x=>'<option>'+x+'</option>').join("");$("areaFilter").innerHTML=areas.map(x=>'<option>'+x+'</option>').join("");$("catFilter").value=cats.includes(cv)?cv:"전체";$("areaFilter").value=areas.includes(av)?av:"전체";const cat=$("catFilter").value,area=$("areaFilter").value;const arr=s.spots.map((x,i)=>({...x,idx:i})).filter(x=>(cat==="전체"||x.cat===cat)&&(area==="전체"||x.area===area));$("spotsBox").innerHTML=arr.map(x=>'<div class="spot"><div class="spotname">'+x.name+'</div><div class="tags"><span class="tag">'+x.cat+'</span><span class="tag">'+x.area+'</span></div><div class="small">'+(x.note||"")+'</div>'+(x.menu?'<div class="menu"><b>🍽 여기서는</b> '+x.menu+'</div>':'')+'<div class="spotactions"><button onclick="spotMap('+x.idx+')">🗺 지도</button>'+(x.source?'<button onclick="spotSource('+x.idx+')">🔎 출처</button>':'<button disabled>출처 -</button>')+'<button onclick="editSpot('+x.idx+')">수정</button><button onclick="delSpot('+x.idx+')">삭제</button></div></div>').join("")}
